services:
  db:
    image: postgres:16-alpine
    container_name: spendleak-postgres
    restart: always
    environment:
      POSTGRES_USER: spendleak_user
      POSTGRES_PASSWORD: spendleak_password
      POSTGRES_DB: spendleak
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendleak_user -d spendleak"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: spendleak-api
    restart: always
    environment:
      - DATABASE_URL=postgresql://spendleak_user:spendleak_password@db:5432/spendleak
      - ENVIRONMENT=development
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-super-secret-jwt-key-for-dev}
      - CORS_ORIGINS=*
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: spendleak-web
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
